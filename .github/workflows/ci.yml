name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build for ${{ matrix.destination }}
    runs-on: macos-latest
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          - 'platform=tvOS Simulator,name=Apple TV,OS=latest'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Build
        run: |
          xcodebuild build-for-testing \
            -scheme iosMathText \
            -destination "${{ matrix.destination }}"


